# iOS derlemesi: GitHub'ın Mac sunucusunda Xcode ile derler, imzalar ve TestFlight'a yükler.
# İmza sertifikası ve profili Xcode, App Store Connect API anahtarıyla kendisi oluşturur
# (Expo hesabı gerekmez).
#
# Gerekli GitHub sırları (Settings > Secrets and variables > Actions):
#   APPSTORE_API_KEY      App Store Connect API anahtarı (.p8 dosyasının tüm içeriği), rolü "Admin"
#   APPSTORE_KEY_ID       Anahtar kimliği (Key ID)
#   APPSTORE_ISSUER_ID    Issuer ID
#   APPLE_TEAM_ID         Apple Developer takım kimliği (10 karakter)
# Ayrıca App Store Connect'te com.dijitesla.kazadefteri paket kimliğiyle uygulama kaydı açılmış olmalı.
#
# Çalıştırma: Actions > iOS derle (TestFlight) > Run workflow, ya da commit mesajında [ios] geçen bir gönderim.
name: iOS derle (TestFlight)

on:
  push:
    branches: [main, claude/awesome-dijkstra-p8rc68]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ios]')
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TAKIM: ${{ secrets.APPLE_TEAM_ID }}
      ANAHTAR_ID: ${{ secrets.APPSTORE_KEY_ID }}
      YAYINCI_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
    steps:
      - name: Apple bilgilerini denetle
        env:
          ANAHTAR: ${{ secrets.APPSTORE_API_KEY }}
        run: |
          eksik=""
          [ -z "$ANAHTAR" ] && eksik="$eksik APPSTORE_API_KEY"
          [ -z "$ANAHTAR_ID" ] && eksik="$eksik APPSTORE_KEY_ID"
          [ -z "$YAYINCI_ID" ] && eksik="$eksik APPSTORE_ISSUER_ID"
          [ -z "$TAKIM" ] && eksik="$eksik APPLE_TEAM_ID"
          if [ -n "$eksik" ]; then
            echo "::error::Eksik GitHub sırları:$eksik (ios.yml başındaki açıklamaya bak)"
            exit 1
          fi
          printf '%s' "$ANAHTAR" > "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Derleme numarasını ayarla
        # Her TestFlight yüklemesi farklı bir derleme numarası ister.
        run: |
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("app.json"));
            a.expo.ios.buildNumber = String(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync("app.json", JSON.stringify(a, null, 2));'

      - name: iOS projesini üret
        run: npx expo prebuild --platform ios
        env:
          CI: 1

      - name: Arşivle (imzalı)
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/KazaDefteri.xcworkspace \
            -scheme KazaDefteri \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/KazaDefteri.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ANAHTAR_ID" \
            -authenticationKeyIssuerID "$YAYINCI_ID" \
            DEVELOPMENT_TEAM="$TAKIM" \
            CODE_SIGN_STYLE=Automatic \
            | tail -n 200

      - name: TestFlight'a yükle
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TAKIM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/KazaDefteri.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ANAHTAR_ID" \
            -authenticationKeyIssuerID "$YAYINCI_ID" \
            | tail -n 100

      - name: Anahtarı sil
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
